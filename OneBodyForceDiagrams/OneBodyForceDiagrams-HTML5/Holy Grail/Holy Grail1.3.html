<html>
<!-- this is v1.3, 2016/1/19; see also https://github.com/philipwalton/flexbugs -->
<body class="HolyGrail">
  <header><span style="float:left; text-align:left; width:33%; font-size:14px; font-weight:normal;">header</span><span style="float:left; width:100%; text-align:center;">The Holy Grail Layout</span></header>
  <div class="HolyGrail-body">
    <main class="HolyGrail-main">main: <a href="http://philipwalton.github.io/solved-by-flexbox/demos/holy-grail/">The Holy Grail Layout description.</a></main>
    <nav class="HolyGrail-nav">nav</nav>
    <aside class="HolyGrail-aside">aside</aside>
  </div>
  <footer>footer</footer>
</body>
</html>
<style>
.HolyGrail, .HolyGrail-body {
  display: flex;
  flex-direction: column;
  background-color:lightblue;
  height:14em;
}

header {
  background-color:pink;
  font-size:16pt;
  font-weight: bold;
  padding-bottom:1em;
}

.HolyGrail-nav {
  order: -1;
}

.HolyGrail-main {
  background-color:white;
  height:10em;
}
footer {
  background-color:yellow;
}

.HolyGrail-nav, .HolyGrail-aside {
  background-color:lightgreen;
}

@media (min-width: 768px) {
  .HolyGrail-body {
    flex-direction: row;
    flex: 1;
	height:12em;
  }
  .HolyGrail-main {
    flex: 1;
  }
  .HolyGrail-nav, .HolyGrail-aside {
    flex: 0 0 12em;
	height:10em;
  }
}
</style>
