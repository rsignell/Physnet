<html>
    <canvas id="canvas" height="400" width="400"></canvas>
</html>
<script>
	var canvas = document.getElementById("canvas");
	var ctx = canvas.getContext("2d");
    var xPos = 30;
    var yPos = 30;

	// function charWithHat draws a 12 pt char "x", "y", "i", or "j" with hat added at position xPos,yPos on a canvas with context ctx
	// here is a demo output on 4 successive lines
	charWithHat("x",ctx,xPos,yPos);
	yPos = 55;
	charWithHat("y",ctx,xPos,yPos);
	yPos = 80;
	charWithHat("i",ctx,xPos,yPos);
	yPos = 105;
	charWithHat("j",ctx,xPos,yPos);
	
	function charWithHat(char,ctx,xPos,yPos) {
	  const fontHeight = 12;
	  const charFont = "bold " + fontHeight.toString() + "pt Helvetica sans-serif";
      const caretFont = "italic bold " + fontHeight.toString() + "pt New Times Roman";
	  //var char = "i";
	  var ctxSave = ctx;
	  ctx.font = charFont;
	  var metricsForChar = ctx.measureText(char);
	  var charWidth  = metricsForChar.width;
	  // insert the character
	  ctx.fillText(char,xPos,yPos);
	  ctx.font = caretFont;
	  // insert the caret
	  var xCar = xPos + 0.35 * charWidth - 4.3;
	  // there is no command available for 'char height above the baseline' so we use ersatz equations
	  var yCar;
	  if (char == "x" || char == "y") {yCar = yPos-2-fontHeight/6.0}
	  if (char == "i" || char == "j") {yCar = yPos-2-fontHeight/2.75}
	  ctx.fillText("^",xCar,yCar);
	  ctx = ctxSave;
	}  
</script>
