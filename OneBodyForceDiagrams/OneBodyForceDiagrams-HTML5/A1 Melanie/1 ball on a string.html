
<html>
<head>
<title> One-Body Force Diagram </title>
<style>
body{

}
h1{
margin:20px;
}

h2{
color:yellow;

</head>
<body>
<h1 style="color:white">A ball hanging on a string </h1>
<div class="flexbox">
<div class="column1">
<h2>The ball's weight = 17N</h2>

<svg height="90" width="200">
  <rect x="0" y="0" width="200" height="70" style="fill:cornflowerblue; stroke-width:2;stroke:black" />
  <text x="20" y="30" fill="black" font="sans-serif"> The unit vectors: </text>
  <polyline points = "58,42 60,40 62,42 60,40 60,50 70,50 68,48 70,50 68,52" style="fill:none; stroke:black; stroke-width:2">
  </svg>


<p> <b>List of correctly drawn forces:</b> </p>
<p id="correct forces list1"> </p>
<p id="correct forces list2"> </p>
<p id="correct forces list3"> </p>
</div>
<div class="column2">

<canvas id="canvas" height="400px" width="600px" style="border:1px solid black">
</canvas>

</div>
</div>

</body>
<script>
//write instructions
var c=document.getElementById("canvas");
var ctx=c.getContext("2d");
ctx.font="15px Arial";
ctx.fillStyle="green";
ctx.fillText("Draw the resultant force on the ball.", 10,20);

//draw the ball
var c=document.getElementById("canvas");
var ctx=c.getContext("2d");
ctx.beginPath();
ctx.arc(300, 200, 10, 0, 2*Math.PI);
ctx.stroke();

//draw the string
var c=document.getElementById("canvas");
var ctx=c.getContext("2d");
ctx.fillStyle="black";
ctx.fillRect(300, 0, 1, 200);

//draw the force vector
	document.getElementById("canvas").addEventListener("mousedown", vectorFunction);
function vectorFunction() {
//clear the canvas
	canvas.width=canvas.width;
//draw original diagram
	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");
	ctx.font="15px Arial";
	ctx.fillStyle="green";
	ctx.fillText("Draw the resultant force on the ball.", 10,20);
	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");
	ctx.beginPath();
	ctx.arc(300, 200, 10, 0, 2*Math.PI);
	ctx.stroke();
	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");
	ctx.fillStyle="black";
	ctx.fillRect(300, 0, 1, 200);
//draw new vector
    var coordinates = canvas.getBoundingClientRect();
    var x = event.clientX - coordinates.left;
    var y = event.clientY - coordinates.top;  
ctx.beginPath();
ctx.lineWidth="1";
ctx.strokeStyle="blue";
ctx.moveTo(300, 200);
ctx.lineTo(x, y);
ctx.stroke();
ctx.font="15px Arial";
var i = Math.round((x-300)/10);
var j = Math.round((200-y)/10);

var theta = 3*Math.PI/2-Math.atan(j/i);



ctx.fillText("F(resultant) = "+i+"i + " +j+"j", 2*canvas.width/3, 7*canvas.height/8);
if (x>=300){
ctx.translate(x,y);

ctx.rotate(theta);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(8, -8);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(-8,-8);
ctx.stroke();
}

if (x<300){
ctx.translate(x,y);

ctx.rotate(theta);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(-8, 8);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(8,8);
ctx.stroke();
}
ctx.setTransform(1, 0, 0, 1, 0, 0);
 

if(x<=305 && x>=295 && y<=205 &&y>=195){gravFunction()};}
function gravFunction(){
document.getElementById("correct forces list1").innerHTML="<b>F</b>(resultant) = (0<b>i</b> +0<b>j</b>) N.";
//clear the canvas
	canvas.width=canvas.width;
	document.getElementById("canvas").removeEventListener("mousedown", vectorFunction);
	document.getElementById("canvas").addEventListener("mousedown", gravFunction);
//draw original diagram
	var c=document.getElementById("canvas");

	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");

	ctx.arc(300, 200, 10, 0, 2*Math.PI);
	ctx.stroke();
	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");
	ctx.fillStyle="black";
	ctx.fillRect(300, 0, 1, 200);
//draw resultant vector
ctx.font = "10px Arial";
ctx.fillText("F(resultant) = 0i + 0j",310,200);
//draw new vector
    var coordinates = canvas.getBoundingClientRect();
    var x = event.clientX - coordinates.left;
    var y = event.clientY - coordinates.top;  

ctx.beginPath();
ctx.lineWidth="1";
ctx.strokeStyle="blue";
ctx.moveTo(300, 200);
ctx.lineTo(x, y);
ctx.stroke();

var j = Math.round((200-y)/10);
ctx.fillText("F(gravity) = "+i+"i + "+j+"j", 3*canvas.width/4, 7*canvas.height/8);

var theta = 3*Math.PI/2-Math.atan(j/i);
if (x>=300){
ctx.translate(x,y);

ctx.rotate(theta);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(8, -8);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(-8,-8);
ctx.stroke();
}

if (x<300){
ctx.translate(x,y);

ctx.rotate(theta);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(-8, 8);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(8,8);
ctx.stroke();
}
ctx.setTransform(1, 0, 0, 1, 0, 0);
if(x<=305 && x>=295 && y<=375 &&y>=365){stringFunction();}
}
function stringFunction(){
canvas.width=canvas.width;
	document.getElementById("canvas").removeEventListener("mousedown", gravFunction);
	document.getElementById("canvas").addEventListener("mousedown", stringFunction);
document.getElementById("correct forces list2").innerHTML="<b>F</b>(gravity) = (0<b>i</b> - 17<b>j</b>) N.";
//draw original diagram plus resultant plus gravity vector
	var c=document.getElementById("canvas");

	ctx.beginPath();
	ctx.lineWidth="2";
	ctx.strokeStyle="black";
	ctx.moveTo(300, 200);

	ctx.stroke();
	ctx.beginPath();

ctx.strokeStyle="black";

//draw new vector
    var coordinates = canvas.getBoundingClientRect();

var i = Math.round((x-300)/10);
var j = Math.round((200-y)/10);
ctx.font = "15px Arial";

ctx.beginPath();
ctx.lineWidth="1";
ctx.strokeStyle="blue";
ctx.moveTo(300, 200);

ctx.stroke();

var theta = 3*Math.PI/2-Math.atan(j/i);

if (x>=300){
ctx.translate(x,y);

ctx.rotate(theta);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(8, -8);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);

}

if (x<300){
ctx.translate(x,y);

ctx.rotate(theta);
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(-8, 8);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(8,8);
ctx.stroke();
}
ctx.setTransform(1, 0, 0, 1, 0, 0);
if(x<=305 && x>=295 && y<=35 &&y>=25){fin();}

canvas.width=canvas.width;
document.getElementById("canvas").removeEventListener("mousedown", stringFunction);
	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");
	ctx.font="15px Arial";
	ctx.fillStyle="green";
	ctx.fillText("Draw the string force on the ball.", 10,20);
	var c=document.getElementById("canvas");
	var ctx=c.getContext("2d");
	ctx.beginPath();
	ctx.arc(300, 200, 10, 0, 2*Math.PI);
	ctx.stroke();
	var c=document.getElementById("canvas");

	ctx.beginPath();
	ctx.lineWidth="2";

	ctx.moveTo(300, 200);
	ctx.lineTo(300, 370);
ctx.stroke();
ctx.beginPath();
ctx.lineWidth="2";
ctx.strokeStyle="black";
ctx.moveTo(300, 200);
ctx.lineTo(300, 30);
ctx.stroke();

ctx.beginPath();
ctx.lineWidth="2";

ctx.font = "10px Arial";

}
</script>
</html>
