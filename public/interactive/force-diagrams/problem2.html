<!doctype html>
<!--
  Problem 2: Stationary person on horizontal surface
  PersonHorizS class, Peter Signell 1997
-->
<html>
<head>
  <meta charset="UTF-8">
  <title>One-Body Force Diagrams: Problem 3 - Person on Horizontal Surface</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #ccc; font-family: Helvetica, Arial, sans-serif; }
    #app {
      display: grid; grid-template-columns: 302px 372px; grid-template-rows: auto auto;
      gap: 5px; width: 684px; margin: 20px auto; background-color: #c0c0c0; padding: 5px;
    }
    #problemPanel { grid-column:1; grid-row:1; width:302px; height:212px; border:1px solid black; background:#c0c0c0; }
    #problemCanvas { display:block; }
    #messagePanel {
      grid-column:2; grid-row:1; width:372px; height:37px; border:1px solid black; background:#c0c0c0;
      padding:6px 7px; font-size:12px; line-height:1.6; overflow:hidden; cursor:pointer;
    }
    #messagePanel .blink { animation:blink-text 1s step-end infinite; font-weight:bold; }
    @keyframes blink-text { 0%,50%{color:blue} 50.01%,100%{color:#c0c0c0} }
    #messagePanel .done-blink { animation:blink-done 1s step-end infinite; font-weight:bold; }
    @keyframes blink-done { 0%,50%{color:#8b0000} 50.01%,100%{color:#c0c0c0} }
    #resultsPanel {
      grid-column:1; grid-row:2; width:302px; height:237px; border:1px solid black; background:#c0c0c0;
      padding:10px; font-size:13px;
    }
    #resultsHeader { color:blue; margin-bottom:8px; }
    .result-eq { color:black; font-family:monospace; font-size:13px; margin:4px 0; }
    #resultsTrailer { color:#8b0000; font-weight:bold; margin-top:8px; display:none; }
    #userPanel {
      grid-column:2; grid-row:2; position:relative; width:372px; height:402px; border:1px solid black; background:#c0c0c0;
    }
    #userPanel canvas { position:absolute; left:0; top:0; }
    #userBkg{z-index:0;} #userDraw{z-index:1;}
    #equationArea {
      position:absolute; left:10px; bottom:120px; z-index:2; pointer-events:none;
      font-family:monospace; font-size:14px; color:blue;
    }
    #doneText {
      position:absolute; left:10px; top:250px; z-index:2; pointer-events:none;
      font-size:16px; font-weight:bold; color:#8b0000; display:none;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="problemPanel"><canvas id="problemCanvas" width="300" height="210"></canvas></div>
  <div id="messagePanel"><span id="messageText"></span></div>
  <div id="resultsPanel">
    <div id="resultsHeader">Your list of correctly drawn force vectors:</div>
    <div id="resultsList"></div>
    <div id="resultsTrailer">ALL OF YOUR FORCES ARE CORRECT!</div>
  </div>
  <div id="userPanel">
    <canvas id="userBkg" width="370" height="400"></canvas>
    <canvas id="userDraw" width="370" height="400"></canvas>
    <div id="equationArea"></div>
    <div id="doneText">Done!</div>
  </div>
</div>

<script>
"use strict";

// ---- Problem data: PersonHorizS ("00","17","00") ----
// theta=0, cost=1, sint=0
// Resultant=(0,0), Gravity=(0,17), Surface=(0,-17)
var problem = {
  title: "Stationary person on horizontal surface",
  gForce: 17, mA: 0, thetaDeg: 0,
  units: "N", scale: 1/5,
  numForces: 3, numEquations: 1,
  matchForceComps: [1, 1, 1],
  forceNames: ["resultant", "gravity", "surface"],
  blinkerStrings: ["resultant", "gravity", "surface"],
  messageStrings: ["Mouse-draw the ", " force on the person:"],
  truAnsX: [[0], [0], [0]],
  truAnsY: [[0], [17], [-17]],
  tailPosX: 146, tailPosY: 110,
  cost: 1, sint: 0,
  maxTriesEachForce: 1
};

// Draw person stick figure at (uOX, uOY) using lPlot helpers
// phi=0 for upright person (theta=0, mA=0)
function drawUprightPerson(ctx, uOX, uOY, cost, sint) {
  ctx.strokeStyle = "black"; ctx.fillStyle = "black"; ctx.lineWidth = 1;
  lPlot(ctx, uOX, uOY,  0,-8,  0,14);          // torso
  cPlot(ctx, uOX, uOY,  0,20, 6);              // head
  fcPlot(ctx, uOX, uOY, 2,22, 1);              // eyes
  fcPlot(ctx, uOX, uOY,-2,22, 1);
  lPlot(ctx, uOX, uOY, -2,18, 2,18);           // mouth
  lPlot(ctx, uOX, uOY, -2,18,-3,19);
  lPlot(ctx, uOX, uOY,  2,18, 3,19);
  lPlot(ctx, uOX, uOY,  0,10, 15,8);           // arms
  lPlot(ctx, uOX, uOY, 14, 8,  0,-3);
  lPlot(ctx, uOX, uOY,  0,10,-14,10);
  lPlot(ctx, uOX, uOY,-14,10,-16,24);
  fcPlot(ctx, uOX, uOY, 0,0, 2);              // c.g. dot
  // legs: lPlot(g, 0,-8, int(-6*cost), int(-6*sint-26))
  lPlot(ctx, uOX, uOY, 0,-8, Math.round(-6*cost), Math.round(-6*sint-26));
  lPlot(ctx, uOX, uOY, 0,-8, Math.round( 7*cost), Math.round( 7*sint-26));
}

function drawProblemPanel() {
  var ctx = document.getElementById("problemCanvas").getContext("2d");
  var ps = 0.6;
  ctx.fillStyle = "#c0c0c0"; ctx.fillRect(0,0,300,210);
  ctx.strokeStyle = "black"; ctx.lineWidth=1; ctx.strokeRect(0,0,300,210);
  ctx.fillStyle = "black"; ctx.font = "13px Helvetica, Arial, sans-serif";
  ctx.fillText(problem.title + ":", 10, 16);

  // theta=0 so cost=1, sint=0
  var pOriginX = 62*ps, pOriginY = 190*ps; // 37.2, 114
  var inclineL = 160;
  // ground line and incline line (theta=0: both horizontal)
  ctx.beginPath(); ctx.moveTo(pOriginX, pOriginY); ctx.lineTo(pOriginX+inclineL, pOriginY); ctx.stroke();
  // (incline line coincides with ground for theta=0)

  // person at 40% along incline
  var uOX = Math.round(pOriginX + 0.4*inclineL); // 101
  var uOY = Math.round(pOriginY - 26);           // 88
  drawUprightPerson(ctx, uOX, uOY, 1, 0);

  var eqnX = 10, eqnY = 140;
  ctx.fillStyle = "black"; ctx.font = "12px Helvetica, Arial, sans-serif";
  ctx.fillText("Person's weight = " + problem.gForce + " " + problem.units, eqnX, eqnY);
  ctx.fillText("Person's mass\u00d7accel = " + problem.mA + " " + problem.units, eqnX, eqnY + 18);
  ctx.fillText("Unit vectors:", eqnX + 2, eqnY + 40);
  drawIJArrows(ctx, eqnX + 114, eqnY + 55);
}

function drawUserApparatus(ctx) {
  ctx.strokeStyle = "black"; ctx.fillStyle = "black"; ctx.lineWidth = 1;
  // person at tailPosX=146, tailPosY=110
  drawUprightPerson(ctx, problem.tailPosX, problem.tailPosY, 1, 0);
  // horizontal ground line
  lPlot(ctx, problem.tailPosX, problem.tailPosY, 0,-26, Math.round(0.3*160), -26);
  lPlot(ctx, problem.tailPosX, problem.tailPosY, 0,-26, Math.round(-0.2*160), -26);
}
</script>
<script src="engine.js"></script>
</body>
</html>
